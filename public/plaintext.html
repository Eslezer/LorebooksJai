<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorebook → Plain Text</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pt-container { max-width: 900px; margin: 0 auto; padding: 16px 24px; }
    .pt-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .pt-options { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; align-items: center; }
    .pt-options .checkbox-label { font-size: 0.85rem; }
    .pt-sep-input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-family: monospace;
      font-size: 0.85rem;
      width: 160px;
    }
    .pt-sep-input:focus { outline: none; border-color: var(--accent); }
    .pt-label { font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; }
    .pt-textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem;
      resize: vertical;
      line-height: 1.5;
    }
    .pt-textarea:focus { outline: none; border-color: var(--accent); }
    .pt-info { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; margin-bottom: 14px; }
    .pt-count { color: var(--success); font-size: 0.85rem; margin-top: 4px; }
    .pt-filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .pt-filter-row select, .pt-filter-row input[type="text"] {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lorebook → Plain Text</h1>
    <p class="subtitle">Extract only the content from lorebook entries. <a href="/" style="color: var(--accent);">← Back to Editor</a></p>
  </header>

  <div class="pt-container">
    <div class="pt-row">
      <button id="btn-import">Import File</button>
      <button id="btn-paste">Paste & Extract</button>
      <button id="btn-copy" class="hidden">Copy Output</button>
      <button id="btn-download" class="hidden">Download .txt</button>
    </div>

    <label class="pt-label" style="display:block; margin-bottom:6px;">Input (paste lorebook JSON):</label>
    <textarea id="input" class="pt-textarea" rows="8" placeholder="Paste your lorebook JSON here, or use Import File..."></textarea>
    <p class="pt-info">Supports both JanitorAI and SillyTavern formats.</p>

    <!-- Filters -->
    <div id="filter-section" class="hidden">
      <div class="pt-filter-row">
        <span class="pt-label">Filter by tag:</span>
        <select id="pt-tag-filter"><option value="">All tags</option></select>
        <span class="pt-label">Category:</span>
        <select id="pt-cat-filter"><option value="">All categories</option></select>
        <span class="pt-label">Search:</span>
        <input type="text" id="pt-search" placeholder="Filter entries...">
      </div>
    </div>

    <!-- Options -->
    <div class="pt-options">
      <span class="pt-label">Separator:</span>
      <input type="text" id="separator" class="pt-sep-input" value="\n---\n" title="Text between entries. Use \n for newline.">
      <label class="checkbox-label"><input type="checkbox" id="include-names"> Include entry names</label>
      <label class="checkbox-label"><input type="checkbox" id="include-keys"> Include keywords</label>
      <label class="checkbox-label"><input type="checkbox" id="number-entries"> Number entries</label>
    </div>

    <div class="pt-row">
      <button id="btn-extract" class="btn-primary">Extract Content</button>
    </div>

    <label class="pt-label" style="display:block; margin-bottom:6px;">Output (plain text):</label>
    <textarea id="output" class="pt-textarea" rows="18" readonly placeholder="Extracted content will appear here..."></textarea>
    <p id="count" class="pt-count"></p>
  </div>

  <input type="file" id="file-input" accept=".json" style="display:none">

  <script>
    const $ = id => document.getElementById(id);

    let parsedEntries = [];

    function parseEntries(text) {
      const data = JSON.parse(text);
      if (Array.isArray(data)) return data;
      if (data.entries && typeof data.entries === 'object') return Object.values(data.entries);
      throw new Error('Unrecognized format');
    }

    function populateFilters() {
      const tags = new Set();
      const cats = new Set();
      parsedEntries.forEach(e => {
        (e.tags || (e.extensions && e.extensions.janitor_tags) || []).forEach(t => tags.add(t));
        const cat = e.category || (e.extensions && e.extensions.janitor_category) || '';
        if (cat) cats.add(cat);
      });

      const tagSel = $('pt-tag-filter');
      tagSel.innerHTML = '<option value="">All tags</option>' +
        [...tags].sort().map(t => `<option value="${t}">${t}</option>`).join('');

      const catSel = $('pt-cat-filter');
      catSel.innerHTML = '<option value="">All categories</option>' +
        [...cats].sort().map(c => `<option value="${c}">${c}</option>`).join('');

      $('filter-section').classList.remove('hidden');
    }

    function getFilteredEntries() {
      const tagFilter = $('pt-tag-filter').value;
      const catFilter = $('pt-cat-filter').value;
      const search = ($('pt-search').value || '').toLowerCase();

      return parsedEntries.filter(e => {
        const tags = e.tags || (e.extensions && e.extensions.janitor_tags) || [];
        const cat = e.category || (e.extensions && e.extensions.janitor_category) || '';
        const name = e.name || e.comment || '';
        const content = e.content || '';
        const keys = e.keysRaw || (Array.isArray(e.key) ? e.key.join(', ') : '') || '';

        if (tagFilter && !tags.includes(tagFilter)) return false;
        if (catFilter && cat !== catFilter) return false;
        if (search) {
          const haystack = [name, content, keys, ...tags].join(' ').toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      });
    }

    function extract() {
      const raw = $('input').value.trim();
      if (!raw) return;

      try {
        parsedEntries = parseEntries(raw);
      } catch (e) {
        alert('Invalid JSON or unrecognized lorebook format: ' + e.message);
        return;
      }

      populateFilters();
      buildOutput();
    }

    function buildOutput() {
      const filtered = getFilteredEntries();
      const sep = $('separator').value.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
      const includeNames = $('include-names').checked;
      const includeKeys = $('include-keys').checked;
      const numberEntries = $('number-entries').checked;

      let num = 0;
      const texts = filtered.map(e => {
        const content = e.content || '';
        if (!content.trim()) return null;
        num++;
        const parts = [];

        if (numberEntries) {
          const name = e.name || e.comment || 'Unnamed';
          parts.push(includeNames ? `${num}. [${name}]` : `${num}.`);
        } else if (includeNames) {
          const name = e.name || e.comment || 'Unnamed';
          parts.push(`[${name}]`);
        }

        if (includeKeys) {
          const keys = e.keysRaw || (Array.isArray(e.key) ? e.key.join(', ') : '') || '';
          if (keys) parts.push(`Keys: ${keys}`);
        }

        parts.push(content);
        return parts.join('\n');
      }).filter(Boolean);

      $('output').value = texts.join(sep);
      $('count').textContent = `${texts.length} entries extracted${texts.length !== filtered.length ? ` (${filtered.length} matched filter)` : ''}.`;
      $('btn-copy').classList.remove('hidden');
      $('btn-download').classList.remove('hidden');
    }

    // Events
    $('btn-extract').addEventListener('click', extract);

    // Re-extract on filter/option change
    ['pt-tag-filter', 'pt-cat-filter'].forEach(id => $(id).addEventListener('change', () => { if (parsedEntries.length) buildOutput(); }));
    $('pt-search').addEventListener('input', () => { if (parsedEntries.length) buildOutput(); });
    ['include-names', 'include-keys', 'number-entries'].forEach(id => $(id).addEventListener('change', () => { if (parsedEntries.length) buildOutput(); }));
    $('separator').addEventListener('input', () => { if (parsedEntries.length) buildOutput(); });

    $('btn-import').addEventListener('click', () => $('file-input').click());
    $('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { $('input').value = reader.result; extract(); };
      reader.readAsText(file);
      e.target.value = '';
    });

    $('btn-paste').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        $('input').value = text;
        extract();
      } catch { alert('Clipboard access denied. Paste manually into the input box.'); }
    });

    $('btn-copy').addEventListener('click', () => {
      navigator.clipboard.writeText($('output').value).then(() => {
        const btn = $('btn-copy');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500);
      });
    });

    $('btn-download').addEventListener('click', () => {
      const blob = new Blob([$('output').value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lorebook-plaintext.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Drag & drop file support
    document.body.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    document.body.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { $('input').value = reader.result; extract(); };
      reader.readAsText(file);
    });

    // Escape to close nothing, but keep consistent
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') $('input').blur();
    });
  </script>
</body>
</html>
